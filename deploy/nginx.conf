location = /pocket-rescue {
    return 308 /pocket-rescue/;
}

location ^~ /pocket-rescue/assets/ {
    alias /home/ubuntu/pocket-rescue/dist/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    access_log off;
}

location ^~ /pocket-rescue/ {
    alias /home/ubuntu/pocket-rescue/dist/;
    index index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
}
